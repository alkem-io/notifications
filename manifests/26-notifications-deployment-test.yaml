apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: alkemio-notifications-deployment
  labels:
    app: alkemio-notifications
    k8s-app: alkemio-notifications
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alkemio-notifications
  template:
    metadata:
      labels:
        app: alkemio-notifications
    spec:
      containers:
        - name: alkemio-notifications
          image: rg.nl-ams.scw.cloud/alkemio/alkemio-notifications:latest
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: alkemio-rabbitmq-cluster-default-user
                  key: host
            - name: RABBITMQ_PORT
              valueFrom:
                secretKeyRef:
                  name: alkemio-rabbitmq-cluster-default-user
                  key: port
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: alkemio-rabbitmq-cluster-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alkemio-rabbitmq-cluster-default-user
                  key: password
            - name: ALKEMIO_WEBCLIENT_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: ENDPOINT_CLUSTER
          envFrom:
            - secretRef:
                name: alkemio-secrets
            - configMapRef:
                name: alkemio-config
          resources:
            requests:
              cpu: 150m
              memory: 150Mi
            limits:
              cpu: 250m
              memory: 250Mi
          # No HTTP probes (ops-lead decision, 2026-08-21). Nothing routes HTTP to
          # this service — it is a RabbitMQ consumer and /health existed only for
          # the probes — so a probe adds kill authority without information. Under
          # a queue backlog the starved event loop missed the 1s default timeout
          # and liveness killed the pod mid-drain on every restart, a
          # self-sustaining CrashLoopBackOff with zero consumers (PR #581).
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: alkemio-rabbitmq-cluster
                topologyKey: kubernetes.io/hostname
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: alkemio-server
                topologyKey: kubernetes.io/hostname
